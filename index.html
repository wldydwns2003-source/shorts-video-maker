<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쇼츠 영상 소스 메이커</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>▶ 쇼츠 영상 소스 메이커</b><span id="server">PC·모바일 동시 사용</span></header>
<main>
 <section class="panel input"><h2><i>1</i> 쇼츠 대본</h2><textarea id="script" placeholder="대본을 붙여 넣으세요">이거 모르고 주방 정리하면 계속 손해 봅니다. 봉지째 보관하던 조미료가 자꾸 쏟아져서 불편했는데, 이 밀폐용기에 옮겨 담으니 한눈에 보이고 습기도 막아줍니다.</textarea><button id="search">유튜브 영상 찾기</button><p class="note">공개 영상만 검색합니다. 사용할 권리가 있는 영상인지 직접 확인하세요.</p></section>
 <section class="panel results"><h2><i>2</i> 장면별 실제 영상</h2><div id="results" class="empty">대본을 분석하면 실제 YouTube 검색 결과가 표시됩니다.</div></section>
 <section class="panel output"><h2><i>3</i> 자동 타임라인</h2><div class="phone"><div id="previewEmpty">영상을 선택하면<br>여기서 재생할 수 있어요.</div><iframe id="preview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><select id="voice"><option value="ko-KR-SunHiNeural">한국어 여성 음성</option><option value="ko-KR-InJoonNeural">한국어 남성 음성</option></select><button id="render" disabled>1080×1920 MP4 렌더링</button><div class="progress"><div id="bar"></div></div><p id="status">영상 선택 대기 중</p><a id="download">완성 MP4 받기</a></section>
</main><script src="app.js"></script></body></html>
