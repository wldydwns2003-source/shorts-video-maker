<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숏폼 영상 탐색기</title><link rel="stylesheet" href="style.css"><style>.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.filters p{width:100%;margin:0 0 4px}button.chip{width:auto;margin:0;padding:8px 11px;background:#272d38;color:#e9edf5}button.chip.on{background:#65e6b3;color:#07100d}.result{overflow:hidden}.result>img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:8px}.badge{display:inline-block;background:#65e6b3;color:#07100d;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;margin-bottom:8px}#open{display:none;background:#65e6b3;color:#07100d;padding:14px;border-radius:12px;text-align:center;font-weight:900;text-decoration:none}@media(max-width:700px){.finder{display:block}}</style></head><body>
<header><b>▶ 자막 없는 숏폼 탐색기</b><span>PC·모바일</span></header>
<main class="finder">
 <section class="panel input"><h2><i>1</i> 쇼츠 대본</h2><textarea id="script" placeholder="대본을 붙여 넣으세요">여러분 다이소에 이거 하나로 50만 원 아꼈어요. 저희 집 벽지가 묵은 얼룩에 누렇게 변해서 도배 견적을 알아봤는데 진짜 너무 비싸더라고요. 그런데 벽지 위에 바르는 페인트를 발견했어요.</textarea><button id="search">짧은 영상 전체 검색</button><p class="note">YouTube Shorts · TikTok · Instagram Reels · 샤오홍슈 공개 영상에서 찾습니다. 롱폼과 자막 표시 영상은 우선 제외합니다.</p></section>
 <section class="panel results"><h2><i>2</i> 검색 결과</h2><div id="summary" class="filters"></div><div id="results" class="empty">대본을 입력하고 검색 버튼을 누르세요.</div></section>
 <section class="panel output"><h2><i>3</i> 미리보기</h2><div class="phone"><div id="previewEmpty">결과를 누르면<br>여기서 미리 볼 수 있어요.</div><iframe id="preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><p id="status">검색 대기 중</p><a id="open" target="_blank" rel="noopener">원본 게시물 열기</a></section>
</main><script src="app.js"></script></body></html>
