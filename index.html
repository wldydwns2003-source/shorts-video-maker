<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 숏폼 검색·자동 편집기</title><link rel="stylesheet" href="style.css"><style>
.platform-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.platform-open{display:flex;flex-direction:column;gap:4px;background:var(--mint);color:#07100d;padding:13px;border-radius:11px;text-decoration:none}.platform-open span{font-size:11px}.yt-title{margin-top:18px}.video-results{display:grid;grid-template-columns:1fr 1fr;gap:9px}.video-card{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:8px}.video-card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.video-card p{font-size:12px;line-height:1.35;height:34px;overflow:hidden}.video-card div{display:flex;gap:5px}.video-card button,.video-card a{flex:1;margin:0;padding:8px;border-radius:8px;font-size:11px;text-align:center;text-decoration:none}.video-card a{background:#303644;color:#fff}.web-preview{margin:10px auto;max-width:260px}.web-preview iframe{width:100%;aspect-ratio:9/16;border:0;border-radius:12px;background:#000}.web-preview a{display:block;background:var(--mint);color:#07100d;text-align:center;padding:9px;text-decoration:none;border-radius:8px;font-weight:800}@media(max-width:700px){.platform-cards{grid-template-columns:1fr}.video-results{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><b>▶ 무료 숏폼 검색·자동 편집기</b><span>PC·모바일</span></header><main class="workflow">
<section class="panel"><h2><i>1</i> 쇼츠 대본</h2><textarea id="script" placeholder="대본을 붙여 넣으세요"></textarea><button id="makeLinks">전체 플랫폼 영상 검색</button><p class="note">YouTube는 실제 영상을 표시하고 TikTok·릴스·샤오홍슈는 번역된 검색 결과 화면을 엽니다.</p></section>
<section class="panel"><h2><i>2</i> 영상 검색 결과</h2><p id="languages" class="note">대본을 입력하고 검색하세요.</p><div id="links"><div class="empty small">검색 결과가 여기에 표시됩니다.</div></div><h3>여러 영상 미리보기</h3><div id="webPreviews"><div class="empty small">YouTube 결과에서 미리보기를 누르세요.</div></div></section>
<section class="panel"><h2><i>3</i> 고른 영상 파일</h2><label class="file-label">영상 여러 개 선택<input id="files" type="file" accept="video/*" multiple></label><p id="uploadStatus" class="note">검색 결과에서 사용할 영상을 저장한 뒤 선택하세요.</p><div id="sourcePreviews" class="source-previews"></div><select id="voice"><option value="ko-KR-SunHiNeural">한국어 여성 음성</option><option value="ko-KR-InJoonNeural">한국어 남성 음성</option></select><button id="render">자동 컷·MP4 제작</button></section>
<section class="panel"><h2><i>4</i> 완성 영상</h2><p id="renderStatus" class="note">제작 대기 중</p><div class="progress"><div id="bar"></div></div><video id="finalVideo" class="final-video" controls playsinline></video><a id="download" download="shorts-complete.mp4">완성 MP4 다운로드</a></section>
</main><script src="app.js?v=search-cards-5"></script></body></html>
