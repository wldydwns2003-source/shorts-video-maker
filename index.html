<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쇼츠 영상 소스 메이커</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>▶ 쇼츠 영상 소스 메이커</b><span id="server">PC·모바일 동시 사용</span></header>
<main>
 <section class="panel input"><h2><i>1</i> 대본과 원본 영상</h2><textarea id="script" placeholder="대본을 붙여 넣으세요">이거 모르고 주방 정리하면 계속 손해 봅니다. 봉지째 보관하던 조미료가 자꾸 쏟아져서 불편했는데, 이 밀폐용기에 옮겨 담으니 한눈에 보이고 습기도 막아줍니다.</textarea><label class="note">휴대폰에 저장된 원본 영상 선택</label><input id="videos" type="file" accept="video/*" multiple><select id="voice"><option value="ko-KR-SunHiNeural">한국어 여성 음성</option><option value="ko-KR-InJoonNeural">한국어 남성 음성</option></select><button id="auto">자동 컷·MP4 제작</button><p class="note">선택한 영상들을 대본 장면에 자동 배치하고 TTS 길이에 맞게 잘라냅니다.</p></section>
 <section class="panel results"><h2><i>2</i> 원본 영상 미리보기</h2><div id="results" class="empty">휴대폰에서 영상 파일을 선택하세요.</div></section>
 <section class="panel output"><h2><i>3</i> 완성 영상</h2><div class="phone"><div id="previewEmpty">완성된 MP4를<br>여기서 미리 볼 수 있어요.</div><video id="preview" controls playsinline style="display:none;width:100%;height:100%;object-fit:contain;background:#000"></video></div><div class="progress"><div id="bar"></div></div><p id="status">대본 입력 대기 중</p><a id="download" download="shorts-complete.mp4">완성 MP4 다운로드</a></section>
</main><script src="app.js"></script></body></html>
