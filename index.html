<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 숏폼 검색·자동 편집기</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>▶ 무료 숏폼 검색·자동 편집기</b><span>PC·모바일</span></header><main class="workflow">
<section class="panel"><h2><i>1</i> 쇼츠 대본</h2><textarea id="script" placeholder="대본을 붙여 넣으세요"></textarea><button id="makeLinks">다국어 검색 버튼 만들기</button><p class="note">한글 대본을 여러 언어로 바꾸고 각 플랫폼의 검색 결과 화면을 엽니다.</p></section>
<section class="panel"><h2><i>2</i> 플랫폼별 검색</h2><p id="languages" class="note">먼저 검색 버튼을 만들어 주세요.</p><div id="links"><div class="empty small">TikTok · Reels · 샤오홍슈 · YouTube Shorts</div></div></section>
<section class="panel"><h2><i>3</i> 고른 영상 파일</h2><label class="file-label">영상 여러 개 선택<input id="files" type="file" accept="video/*" multiple></label><p id="uploadStatus" class="note">검색 결과에서 사용할 영상을 저장한 뒤 선택하세요.</p><div id="sourcePreviews" class="source-previews"></div><select id="voice"><option value="ko-KR-SunHiNeural">한국어 여성 음성</option><option value="ko-KR-InJoonNeural">한국어 남성 음성</option></select><button id="render">자동 컷·MP4 제작</button></section>
<section class="panel"><h2><i>4</i> 완성 영상</h2><p id="renderStatus" class="note">제작 대기 중</p><div class="progress"><div id="bar"></div></div><video id="finalVideo" class="final-video" controls playsinline></video><a id="download" download="shorts-complete.mp4">완성 MP4 다운로드</a></section>
</main><script src="app.js?v=free-workflow-2"></script></body></html>
